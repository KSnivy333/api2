name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "=== Preparando directorio ==="
            sudo mkdir -p /home/ubuntu/api2
            cd /home/ubuntu/api2
            
            echo "=== Git pull ==="
            if [ ! -d ".git" ]; then
              git clone git@github.com:KSnivy333/api2.git .
            else
              git pull origin main
            fi
            
            echo "=== Configurando venv ==="
            sudo apt update -qq
            sudo apt install -y python3-full python3-pip python3-venv git -qq
            
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            source venv/bin/activate
            
            echo "=== Instalando dependencias ==="
            if [ -f "requirements.txt" ]; then
              pip install -r requirements.txt --quiet
            else
              echo "No requirements.txt encontrado"
            fi
            
            echo "=== Reiniciando servicio (si existe) ==="
            if systemctl is-active --quiet api2; then
              sudo systemctl restart api2
              echo "Servicio api2 reiniciado"
            else
              echo "Servicio api2 no existe aún - crear manualmente"
            fi
